<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYORA AI | Section</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            color: white;
            background:
                    radial-gradient(circle at 50% 0%, #302052, transparent 45%),
                    #080812;
        }

        .panel {
            width: min(90%, 550px);
            padding: 45px 30px;
            border-radius: 23px;
            text-align: center;
            background: rgba(30, 25, 52, .85);
            border: 1px solid #7049a9;
            box-shadow: 0 0 55px rgba(139, 92, 246, .14);
        }

        h1 {
            font-size: 32px;
            background: linear-gradient(90deg, #c084fc, #819cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p {
            color: #aaa5bf;
            line-height: 1.8;
            font-size: 14px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 22px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            background: linear-gradient(100deg, #995cff, #6549db);
        }
    </style>
</head>

<body>
<div class="panel">
    <div style="font-size:40px">✦</div>

    <h1 th:text="${pageTitle}">VYORA Studio</h1>

    <p>
        Welcome to your VYORA AI workspace.
        This section is connected to the main application.
    </p>

    <p>We're building this feature step by step.</p>

    <a href="/">← Back to Dashboard</a>
</div>
</body>
</html>
